services:
  base: &base
    image: navi:dev
    env_file: .env
    volumes:
      - ./source:/home/node/app
      - ./worker:/home/node/worker
      - ./docker_volumes/config:/home/node/app/config
      - ./docker_volumes/node_modules:/home/node/app/node_modules

  base_build:
    <<: *base
    container_name: navi_build
    build:
      context: .
      dockerfile: dockerfiles/dev_navi_hey/Dockerfile
    command: echo done

  navi_app:
    <<: *base
    container_name: navi_app
    depends_on: [base_build, navi_proxy]
    command: tail -f /dev/null
    # For the mounted route-handler / frontend extension workflow see
    # docs/guides/navi/extending-navi.md (exercised by navi_extensions_app below).
    ports:
      - 0.0.0.0:3000:3000
    links:
      - navi_proxy:remote_host

  navi_extensions_app:
    <<: *base
    container_name: navi_extensions_app
    depends_on: [base_build]
    working_dir: /home/node/app
    command: node bin/navi.js -c config/navi_config.yml -m config/menu.yml
    environment:
      NAVI_EXTENSIONS_ENABLED: "true"
    volumes:
      - ./source:/home/node/app
      - ./worker:/home/node/worker
      - ./examples/navi-orders-extension/config:/home/node/app/config:ro
      - ./docker_volumes/node_modules:/home/node/app/node_modules
      - ./examples/navi-orders-extension/dist:/navi/extensions:ro
    ports:
      - 0.0.0.0:3040:3000

  navi_tests:
    <<: *base
    container_name: navi_tests
    depends_on: [base_build]
    command: /bin/bash

  # Downstream extension test harness (dockerfiles/navi-hey-test/). Built and run
  # by the Makefile `build-navi-hey-test` / `test-extension-harness` targets and
  # the matching CI job; profile-gated so it never starts with `docker compose up`.
  # The example's own compose file (examples/navi-orders-extension/) is separate.
  navi_hey_test:
    build:
      context: .
      dockerfile: dockerfiles/navi-hey-test/Dockerfile
    image: navi-hey-test:dev
    working_dir: /work
    profiles: ["extension-tests"]
    volumes:
      - ./examples/navi-orders-extension/src:/work/src:ro
      - ./examples/navi-orders-extension/tests:/work/tests:ro

  navi_proxy:
    image: darthjee/tent:0.10.0
    depends_on: [navi_dev_app, navi_dev_frontend]
    links:
      - navi_dev_app:backend
      - navi_dev_frontend:frontend
    volumes:
      - ./dev/proxy:/var/www/html/configuration/
      - ./docker_volumes/proxy_cache:/var/www/html/cache/
    ports:
      - 0.0.0.0:3010:80
    env_file: .env

  navi_dev_app:
    image: navi_app:dev
    build:
      context: .
      dockerfile: dockerfiles/dev_app/Dockerfile
    command: node server.js
    volumes:
      - ./dev/app/:/home/node/app/
      - ./source/lib/common:/home/node/app/lib/common
      - ./source/spec/lib/common:/home/node/app/spec/lib/common
      - ./docker_volumes/node_modules_dev:/home/node/app/node_modules
    ports:
      - 0.0.0.0:3020:8080

  navi_dev_frontend:
    image: navi_dev_frontend:dev
    build:
      context: .
      dockerfile: dockerfiles/dev_frontend_app/Dockerfile
    command: yarn build
    volumes:
      - ./dev/frontend/:/home/node/app/
      - ./docker_volumes/node_modules_dev_frontend:/home/node/app/node_modules
      - ./dev/app/static:/home/node/app/dist

  navi_frontend:
    image: navi_frontend:dev
    build:
      context: .
      dockerfile: dockerfiles/dev_frontend/Dockerfile
    command: yarn server
    volumes:
      - ./frontend:/home/node/app
      - ./docker_volumes/node_modules_frontend:/home/node/app/node_modules
      - ./source/static:/home/node/app/dist

  navi_web_proxy:
    image: darthjee/tent:0.10.0
    depends_on: [navi_app, navi_frontend]
    links:
      - navi_app:backend
      - navi_frontend:frontend
    env_file: .env
    volumes:
      - ./dev/web_proxy:/var/www/html/configuration/
    ports:
      - 0.0.0.0:3030:80
