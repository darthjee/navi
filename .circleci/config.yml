version: 2.1

workflows:
  test-and-release:
    jobs:
      - jasmine:
          filters: &all-tags
            tags:
              only: /.*/
      - checks:
          filters: *all-tags
      - jasmine-dev:
          filters: *all-tags
      - checks-dev:
          filters: *all-tags
      - jasmine-dev-frontend:
          filters: *all-tags
      - checks-dev-frontend:
          filters: *all-tags
      - checks-frontend:
          filters: *all-tags
      - jasmine-frontend:
          filters: *all-tags
      - jasmine-client:
          filters: *all-tags
      - checks-client:
          filters: *all-tags
      - jasmine-worker:
          filters: *all-tags
      - checks-worker:
          filters: *all-tags
      - coverage-final:
          requires: [jasmine, jasmine-dev, jasmine-dev-frontend, jasmine-frontend, jasmine-client, jasmine-worker]
          filters: *all-tags
      - check-version-tag:
          filters: &version-tag-filters
            tags:
              only: /\d+\.\d+\.\d+/
            branches:
              ignore: /.*/
      - check-worker-changes:
          filters: *version-tag-filters
      - npm-publish:
          requires: [check-version-tag, jasmine, jasmine-dev, jasmine-dev-frontend, jasmine-frontend, checks, checks-dev, checks-dev-frontend, checks-frontend, check-worker-changes]
          filters: *version-tag-filters
      - check-client-version-tag:
          filters: &client-tag-filters
            tags:
              only: /client-\d+\.\d+\.\d+/
            branches:
              ignore: /.*/
      - npm-publish-client:
          requires: [check-client-version-tag, jasmine-client, checks-client]
          filters: *client-tag-filters
      - build-and-release:
          requires: [npm-publish]
          filters: *version-tag-filters
      - update-description:
          requires: [build-and-release]
          filters: *version-tag-filters
      - build-and-release-client:
          requires: [npm-publish-client]
          filters: *client-tag-filters
      - update-description-client:
          requires: [build-and-release-client]
          filters: *client-tag-filters
      - build-and-release-demo:
          requires: [build-and-release]
          filters: *version-tag-filters
      - build-and-release-demo-app:
          requires: [build-and-release]
          filters: *version-tag-filters
      - check-worker-version-tag:
          filters: &worker-tag-filters
            tags:
              only: /worker-\d+\.\d+\.\d+/
            branches:
              ignore: /.*/
      - npm-publish-worker:
          requires: [check-worker-version-tag, jasmine-worker, checks-worker]
          filters: *worker-tag-filters

executors:
  node-ci:
    docker:
      - image: darthjee/circleci_node:0.2.1
  scripts-ci:
    docker:
      - image: darthjee/scripts:0.6.0

commands:
  install-deps:
    parameters:
      path:
        type: string
      frozen:
        type: boolean
        default: false
    steps:
      - run:
          name: Install dependencies
          command: |
            cd <<parameters.path>>
            if [ "<<parameters.frozen>>" = "true" ]; then
              yarn install --frozen-lockfile
            else
              yarn install
            fi

  run-tests:
    parameters:
      path:
        type: string
    steps:
      - run:
          name: Unit tests (Jasmine)
          command: cd <<parameters.path>>; npm run coverage
      - run:
          name: Upload coverage to Codacy (partial)
          command: scripts/ci.sh coverage <<parameters.path>>

  lint-and-report:
    parameters:
      path:
        type: string
    steps:
      - run:
          name: Lint
          command: cd <<parameters.path>>; npm run lint
      - run:
          name: Duplication report (JSCPD)
          command: cd <<parameters.path>>; npm run report

jobs:
  jasmine:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: source
      - run-tests:
          path: source
  checks:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: source
      - lint-and-report:
          path: source

  jasmine-dev:
    executor: node-ci
    steps:
      - checkout
      - run:
          name: Copy common code from source
          command: scripts/ci.sh setup-dev
      - install-deps:
          path: dev/app
      - run-tests:
          path: dev/app

  checks-dev:
    executor: node-ci
    steps:
      - checkout
      - run:
          name: Copy common code from source
          command: scripts/ci.sh setup-dev
      - install-deps:
          path: dev/app
      - lint-and-report:
          path: dev/app

  jasmine-dev-frontend:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: dev/frontend
      - run-tests:
          path: dev/frontend

  checks-dev-frontend:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: dev/frontend
      - lint-and-report:
          path: dev/frontend

  checks-frontend:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: frontend
      - lint-and-report:
          path: frontend

  jasmine-frontend:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: frontend
      - run-tests:
          path: frontend

  jasmine-client:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: clients/node
      - run-tests:
          path: clients/node

  checks-client:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: clients/node
      - lint-and-report:
          path: clients/node

  jasmine-worker:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: worker
      - run-tests:
          path: worker

  checks-worker:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: worker
      - lint-and-report:
          path: worker

  coverage-final:
    executor: node-ci
    steps:
      - checkout
      - run:
          name: Finalize coverage on Codacy
          command: scripts/ci.sh coverage-final

  check-version-tag:
    docker:
      - image: darthjee/circleci_node:0.2.1
    steps:
      - checkout
      - run:
          name: Check tag matches package.json and README versions
          command: bash scripts/check_tag_version.sh

  check-worker-changes:
    docker:
      - image: darthjee/circleci_node:0.2.1
    steps:
      - checkout
      - run:
          name: Check if worker/ changed since last release
          command: |
            LAST_TAG=$(git describe --tags --abbrev=0 --match='worker-*' --match='[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "")
            if [ -z "$LAST_TAG" ]; then
              echo "No previous release tag found — worker release recommended"
              exit 0
            fi
            if git diff --quiet "$LAST_TAG"..HEAD -- worker/; then
              echo "No changes in worker/ since $LAST_TAG — skipping"
              exit 0
            else
              echo "WARNING: worker/ has changes since $LAST_TAG"
              echo "A worker release (worker-x.y.z tag) should be created before or alongside this navi release"
              echo "Run: scripts/bump_version.sh worker [version]"
              exit 0
            fi

  npm-publish:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: source
          frozen: true
      - run:
          name: Install frontend dependencies
          command: cd frontend && yarn install
      - run:
          name: Build frontend
          command: cd frontend && yarn build
      - run:
          name: Copy frontend build to source/static
          command: cp -r frontend/dist/. source/static/
      - run:
          name: Replace local file dependency with npm version
          command: |
            sed -i 's/"deku-swarm": "file:..\//"deku-swarm": "^/' source/package.json
      - run:
          name: Publish to npm
          command: scripts/ci.sh publish source

  check-client-version-tag:
    docker:
      - image: darthjee/circleci_node:0.2.1
    steps:
      - checkout
      - run:
          name: Check tag matches clients/node/package.json and README versions
          command: bash scripts/check_client_tag_version.sh

  npm-publish-client:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: clients/node
          frozen: true
      - run:
          name: Publish to npm
          command: scripts/ci.sh publish clients/node

  check-worker-version-tag:
    docker:
      - image: darthjee/circleci_node:0.2.1
    steps:
      - checkout
      - run:
          name: Check tag matches worker/package.json and README versions
          command: bash scripts/check_worker_tag_version.sh

  npm-publish-worker:
    executor: node-ci
    steps:
      - checkout
      - run:
          name: Check if version already exists on npm
          command: |
            VERSION=$(node -p "require('./worker/package.json').version")
            if npm view deku-swarm@$VERSION version 2>/dev/null; then
              echo "deku-swarm@$VERSION already exists on npm — skipping publish"
              circleci-agent step halt
            fi
      - install-deps:
          path: worker
          frozen: true
      - run:
          name: Publish to npm
          command: scripts/ci.sh publish worker

  build-and-release-client:
    machine: true
    steps:
      - checkout
      - run:
          name: Build and release client image
          command: make release-client TAG=$(echo $CIRCLE_TAG | sed 's/^client-//')

  update-description-client:
    docker:
      - image: darthjee/scripts:0.6.0
    steps:
      - checkout
      - run:
          name: Update client Docker Hub description
          command: sh scripts/update-description-client.sh

  build-and-release:
    machine: true
    steps:
      - checkout
      - run:
          name: Build and release
          command: make release TAG=${CIRCLE_TAG:-latest}

  update-description:
    docker:
      - image: darthjee/scripts:0.6.0
    steps:
      - checkout
      - run:
          name: Update Docker Hub description
          command: sh scripts/update-description.sh

  build-and-release-demo:
    machine: true
    steps:
      - checkout
      - run:
          name: Trigger Deploy
          command: RENDER_SERVICE_NAME=$DEMO_RENDER_SERVICE_NAME scripts/deploy.sh deploy

  build-and-release-demo-app:
    machine: true
    steps:
      - checkout
      - run:
          name: Trigger Deploy
          command: RENDER_SERVICE_NAME=$DEMO_APP_RENDER_SERVICE_NAME scripts/deploy.sh deploy
