version: 2.1

workflows:
  test-and-release:
    jobs:
      - jasmine:
          filters: &test-filters
            tags:
              only: /^\d+\.\d+\.\d+$/
      - checks:
          filters: *test-filters
      - jasmine-dev:
          filters: *test-filters
      - checks-dev:
          filters: *test-filters
      - jasmine-dev-frontend:
          filters: *test-filters
      - checks-dev-frontend:
          filters: *test-filters
      - checks-frontend:
          filters: *test-filters
      - jasmine-frontend:
          filters: *test-filters
      - jasmine-client:
          filters: *test-filters
      - checks-client:
          filters: *test-filters
      - jasmine-worker:
          filters: *test-filters
      - checks-worker:
          filters: *test-filters
      - jasmine-deku-sprout:
          filters: *test-filters
      - checks-deku-sprout:
          filters: *test-filters
      - jasmine-release:
          filters: *test-filters
      - checks-release:
          filters: *test-filters
      - validate-release-yml:
          filters: *test-filters
      - cascade-bump-check:
          filters: *test-filters
      - smoke-extensions:
          filters: *test-filters
      - test-extension-harness:
          filters: *test-filters
      - coverage-final:
          requires: [jasmine, jasmine-dev, jasmine-dev-frontend, jasmine-frontend, jasmine-client, jasmine-worker, jasmine-deku-sprout, jasmine-release]
          filters: *test-filters
      - check-version-tag:
          filters: &version-tag-filters
            tags:
              only: /^\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
      - check-and-publish-worker:
          filters: *version-tag-filters
      - check-and-publish-deku-sprout:
          filters: *version-tag-filters
      - npm-publish:
          requires: [check-version-tag, jasmine, jasmine-dev, jasmine-dev-frontend, jasmine-frontend, checks, checks-dev, checks-dev-frontend, checks-frontend, check-and-publish-worker, check-and-publish-deku-sprout, smoke-extensions, test-extension-harness]
          filters: *version-tag-filters
      - build-and-release:
          requires: [npm-publish]
          filters: *version-tag-filters
      - update-description:
          requires: [build-and-release]
          filters: *version-tag-filters
      - build-and-release-demo:
          requires: [build-and-release]
          filters: *version-tag-filters
      - build-and-release-demo-app:
          requires: [build-and-release]
          filters: *version-tag-filters
      - build-and-release-navi-hey-test:
          requires: [build-and-release]
          filters: *version-tag-filters

executors:
  node-ci:
    docker:
      - image: darthjee/circleci_node:0.2.1
  scripts-ci:
    docker:
      - image: darthjee/scripts:0.6.0

commands:
  install-deps:
    parameters:
      path:
        type: string
      frozen:
        type: boolean
        default: false
    steps:
      - run:
          name: Install dependencies
          command: scripts/ci.sh install-deps <<parameters.path>> <<parameters.frozen>>

  run-tests:
    parameters:
      path:
        type: string
    steps:
      - run:
          name: Unit tests (Jasmine)
          command: cd <<parameters.path>>; npm run coverage
      - run:
          name: Upload coverage to Codacy (partial)
          command: scripts/ci.sh coverage <<parameters.path>>

  lint-and-report:
    parameters:
      path:
        type: string
    steps:
      - run:
          name: Lint and report
          command: scripts/ci.sh lint-and-report <<parameters.path>>

jobs:
  jasmine:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: source
      - run-tests:
          path: source
  checks:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: source
      - lint-and-report:
          path: source

  jasmine-dev:
    executor: node-ci
    steps:
      - checkout
      - run:
          name: Copy common code from source
          command: scripts/ci.sh setup-dev
      - install-deps:
          path: dev/app
      - run-tests:
          path: dev/app

  checks-dev:
    executor: node-ci
    steps:
      - checkout
      - run:
          name: Copy common code from source
          command: scripts/ci.sh setup-dev
      - install-deps:
          path: dev/app
      - lint-and-report:
          path: dev/app

  jasmine-dev-frontend:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: dev/frontend
      - run-tests:
          path: dev/frontend

  checks-dev-frontend:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: dev/frontend
      - lint-and-report:
          path: dev/frontend

  checks-frontend:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: frontend
      - lint-and-report:
          path: frontend

  jasmine-frontend:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: frontend
      - run-tests:
          path: frontend

  jasmine-client:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: clients/node
          frozen: true
      - run-tests:
          path: clients/node

  checks-client:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: clients/node
          frozen: true
      - lint-and-report:
          path: clients/node

  jasmine-worker:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: worker
      - run-tests:
          path: worker

  checks-worker:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: worker
      - lint-and-report:
          path: worker

  jasmine-deku-sprout:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: logger
      - run-tests:
          path: logger

  checks-deku-sprout:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: logger
      - lint-and-report:
          path: logger

  jasmine-release:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: scripts/release
      - run-tests:
          path: scripts/release

  checks-release:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: scripts/release
      - lint-and-report:
          path: scripts/release

  validate-release-yml:
    executor: node-ci
    steps:
      - checkout
      - run:
          name: Validate release.yml against package.json files
          command: scripts/ci.sh validate-release-yml

  cascade-bump-check:
    executor: node-ci
    steps:
      - checkout
      - run:
          name: Check that dependents of bumped packages are bumped too
          command: scripts/ci.sh cascade-bump-check

  coverage-final:
    executor: node-ci
    steps:
      - checkout
      - run:
          name: Finalize coverage on Codacy
          command: scripts/ci.sh coverage-final

  smoke-extensions:
    machine: true
    steps:
      - checkout
      - run:
          name: Boot the composed stack with the example extension and assert
          command: make smoke-extensions

  test-extension-harness:
    machine: true
    steps:
      - checkout
      - run:
          name: Build navi-hey-test image and run the example extension suite through it
          command: make test-extension-harness

  check-version-tag:
    docker:
      - image: darthjee/circleci_node:0.2.1
    steps:
      - checkout
      - run:
          name: Check tag matches package.json and README versions
          command: bash scripts/check_tag_version.sh

  check-and-publish-worker:
    docker:
      - image: darthjee/circleci_node:0.2.1
    steps:
      - checkout
      - run:
          name: Publish deku-swarm if its version is not on npm
          command: scripts/ci.sh check-and-publish-worker

  check-and-publish-deku-sprout:
    docker:
      - image: darthjee/circleci_node:0.2.1
    steps:
      - checkout
      - run:
          name: Publish deku-sprout if its version is not on npm
          command: scripts/ci.sh check-and-publish-deku-sprout

  npm-publish:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: source
          frozen: true
      - run:
          name: Build frontend
          command: scripts/ci.sh build-frontend
      - run:
          name: Pin local dependencies
          command: scripts/ci.sh pin-local-deps
      - run:
          name: Wait for pinned dependencies on npm
          command: |
            scripts/ci.sh wait-for-npm deku-swarm "$(node -p "require('./worker/package.json').version")"
            scripts/ci.sh wait-for-npm deku-sprout "$(node -p "require('./logger/package.json').version")"
      - run:
          name: Publish to npm
          command: scripts/ci.sh publish source
      - run:
          name: Wait for navi-hey on npm
          command: scripts/ci.sh wait-for-npm navi-hey "$CIRCLE_TAG"

  build-and-release-client:
    machine: true
    steps:
      - checkout
      - run:
          name: Build and release client image
          command: make release-client TAG=$(echo $CIRCLE_TAG | sed 's/^client-//')

  update-description-client:
    docker:
      - image: darthjee/scripts:0.6.0
    steps:
      - checkout
      - run:
          name: Update client Docker Hub description
          command: sh scripts/update-description-client.sh

  build-and-release:
    machine: true
    steps:
      - checkout
      - run:
          name: Build and release
          command: make release TAG=${CIRCLE_TAG:-latest}

  update-description:
    docker:
      - image: darthjee/scripts:0.6.0
    steps:
      - checkout
      - run:
          name: Update Docker Hub description
          command: sh scripts/update-description.sh

  build-and-release-demo:
    machine: true
    steps:
      - checkout
      - run:
          name: Trigger Deploy
          command: RENDER_SERVICE_NAME=$DEMO_RENDER_SERVICE_NAME scripts/deploy.sh deploy

  build-and-release-demo-app:
    machine: true
    steps:
      - checkout
      - run:
          name: Trigger Deploy
          command: RENDER_SERVICE_NAME=$DEMO_APP_RENDER_SERVICE_NAME scripts/deploy.sh deploy

  build-and-release-navi-hey-test:
    machine: true
    steps:
      - checkout
      - run:
          name: Build and release the navi-hey-test harness image
          command: make release-navi-hey-test TAG=${CIRCLE_TAG}
