version: 2.1

workflows:
  test-and-release:
    jobs:
      - jasmine:
          filters: &test-filters
            tags:
              only: /^\d+\.\d+\.\d+$/
      - checks:
          filters: *test-filters
      - jasmine-dev:
          filters: *test-filters
      - checks-dev:
          filters: *test-filters
      - jasmine-dev-frontend:
          filters: *test-filters
      - checks-dev-frontend:
          filters: *test-filters
      - checks-frontend:
          filters: *test-filters
      - jasmine-frontend:
          filters: *test-filters
      - jasmine-client:
          filters: *test-filters
      - checks-client:
          filters: *test-filters
      - jasmine-worker:
          filters: *test-filters
      - checks-worker:
          filters: *test-filters
      - jasmine-deku-sprout:
          filters: *test-filters
      - checks-deku-sprout:
          filters: *test-filters
      - jasmine-release:
          filters: *test-filters
      - checks-release:
          filters: *test-filters
      - validate-release-yml:
          filters: *test-filters
      - cascade-bump-check:
          filters: *test-filters
      - smoke-extensions:
          filters: *test-filters
      - test-extension-harness:
          filters: *test-filters
      - coverage-final:
          requires: [jasmine, jasmine-dev, jasmine-dev-frontend, jasmine-frontend, jasmine-client, jasmine-worker, jasmine-deku-sprout, jasmine-release]
          filters: *test-filters
      - check-version-tag:
          filters: &version-tag-filters
            tags:
              only: /^\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
      # One release job per npm package of release.yml. Their `requires` must
      # mirror release.yml's `depends_on` (each job also waits for its
      # dependencies on npm, inside scripts/ci/release-npm-package.sh).
      - release-deku-sprout:
          requires: [check-version-tag, validate-release-yml, cascade-bump-check, jasmine, jasmine-dev, jasmine-dev-frontend, jasmine-frontend, jasmine-client, jasmine-worker, jasmine-deku-sprout, jasmine-release, checks, checks-dev, checks-dev-frontend, checks-frontend, checks-client, checks-worker, checks-deku-sprout, checks-release, smoke-extensions, test-extension-harness]
          filters: *version-tag-filters
      - release-deku-swarm:
          requires: [check-version-tag, validate-release-yml, cascade-bump-check, jasmine, jasmine-dev, jasmine-dev-frontend, jasmine-frontend, jasmine-client, jasmine-worker, jasmine-deku-sprout, jasmine-release, checks, checks-dev, checks-dev-frontend, checks-frontend, checks-client, checks-worker, checks-deku-sprout, checks-release, smoke-extensions, test-extension-harness]
          filters: *version-tag-filters
      - release-navi-hey:
          requires: [check-version-tag, validate-release-yml, cascade-bump-check, jasmine, jasmine-dev, jasmine-dev-frontend, jasmine-frontend, jasmine-client, jasmine-worker, jasmine-deku-sprout, jasmine-release, checks, checks-dev, checks-dev-frontend, checks-frontend, checks-client, checks-worker, checks-deku-sprout, checks-release, smoke-extensions, test-extension-harness, release-deku-sprout, release-deku-swarm]
          filters: *version-tag-filters
      - release-navi-hey-client:
          requires: [check-version-tag, validate-release-yml, cascade-bump-check, jasmine, jasmine-dev, jasmine-dev-frontend, jasmine-frontend, jasmine-client, jasmine-worker, jasmine-deku-sprout, jasmine-release, checks, checks-dev, checks-dev-frontend, checks-frontend, checks-client, checks-worker, checks-deku-sprout, checks-release, smoke-extensions, test-extension-harness, release-deku-sprout]
          filters: *version-tag-filters
      # One extra-tag job per npm package with a release.yml `tag_prefix`.
      # Each one always runs after its release job, halts as a no-op when the
      # package did not publish (released/<package>), and otherwise pushes
      # the annotated `<tag_prefix><version>` tag on the commit being built.
      - push-tag-deku-sprout:
          requires: [release-deku-sprout]
          filters: *version-tag-filters
      - push-tag-deku-swarm:
          requires: [release-deku-swarm]
          filters: *version-tag-filters
      - push-tag-navi-hey-client:
          requires: [release-navi-hey-client]
          filters: *version-tag-filters
      # One release job per Docker image, after its npm package (release.yml
      # `depends_on`). Each one always runs, releases the image only when
      # its package.json version is missing on Docker Hub, and records the
      # outcome in the workspace (released/<image>). The jobs after an image
      # always run too, but halt as a no-op when their image did not release.
      - release-darthjee-navi-hey:
          requires: [release-navi-hey]
          filters: *version-tag-filters
      - release-darthjee-navi-hey-client:
          requires: [release-navi-hey-client]
          filters: *version-tag-filters
      - update-description:
          requires: [release-darthjee-navi-hey]
          filters: *version-tag-filters
      - build-and-release-demo:
          requires: [release-darthjee-navi-hey]
          filters: *version-tag-filters
      - build-and-release-demo-app:
          requires: [release-darthjee-navi-hey]
          filters: *version-tag-filters
      - build-and-release-navi-hey-test:
          requires: [release-darthjee-navi-hey]
          filters: *version-tag-filters
      - update-description-client:
          requires: [release-darthjee-navi-hey-client]
          filters: *version-tag-filters

executors:
  node-ci:
    docker:
      - image: darthjee/circleci_node:0.2.1
  scripts-ci:
    docker:
      - image: darthjee/scripts:0.6.0

commands:
  install-deps:
    parameters:
      path:
        type: string
      frozen:
        type: boolean
        default: false
    steps:
      - run:
          name: Install dependencies
          command: scripts/ci.sh install-deps <<parameters.path>> <<parameters.frozen>>

  run-tests:
    parameters:
      path:
        type: string
    steps:
      - run:
          name: Unit tests (Jasmine)
          command: cd <<parameters.path>>; npm run coverage
      - run:
          name: Upload coverage to Codacy (partial)
          command: scripts/ci.sh coverage <<parameters.path>>

  lint-and-report:
    parameters:
      path:
        type: string
    steps:
      - run:
          name: Lint and report
          command: scripts/ci.sh lint-and-report <<parameters.path>>

  skip-unless-released:
    parameters:
      # `release` (not `name`, a reserved CircleCI parameter): the
      # release.yml name of an npm package or Docker image.
      release:
        type: string
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Halt unless <<parameters.release>> was released
          # Plain sh (not scripts/ci.sh): the darthjee/scripts image has no bash.
          command: |
            set +e
            sh scripts/ci/released.sh <<parameters.release>>
            status=$?
            set -e
            if [ "$status" = "1" ]; then
              circleci-agent step halt
              exit 0
            fi
            [ "$status" = "0" ]

jobs:
  jasmine:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: source
      - run-tests:
          path: source
  checks:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: source
      - lint-and-report:
          path: source

  jasmine-dev:
    executor: node-ci
    steps:
      - checkout
      - run:
          name: Copy common code from source
          command: scripts/ci.sh setup-dev
      - install-deps:
          path: dev/app
      - run-tests:
          path: dev/app

  checks-dev:
    executor: node-ci
    steps:
      - checkout
      - run:
          name: Copy common code from source
          command: scripts/ci.sh setup-dev
      - install-deps:
          path: dev/app
      - lint-and-report:
          path: dev/app

  jasmine-dev-frontend:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: dev/frontend
      - run-tests:
          path: dev/frontend

  checks-dev-frontend:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: dev/frontend
      - lint-and-report:
          path: dev/frontend

  checks-frontend:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: frontend
      - lint-and-report:
          path: frontend

  jasmine-frontend:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: frontend
      - run-tests:
          path: frontend

  jasmine-client:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: clients/node
          frozen: true
      - run-tests:
          path: clients/node

  checks-client:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: clients/node
          frozen: true
      - lint-and-report:
          path: clients/node

  jasmine-worker:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: worker
      - run-tests:
          path: worker

  checks-worker:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: worker
      - lint-and-report:
          path: worker

  jasmine-deku-sprout:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: logger
      - run-tests:
          path: logger

  checks-deku-sprout:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: logger
      - lint-and-report:
          path: logger

  jasmine-release:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: scripts/release
      - run-tests:
          path: scripts/release

  checks-release:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: scripts/release
      - lint-and-report:
          path: scripts/release

  validate-release-yml:
    executor: node-ci
    steps:
      - checkout
      - run:
          name: Validate release.yml against package.json files
          command: scripts/ci.sh validate-release-yml

  cascade-bump-check:
    executor: node-ci
    steps:
      - checkout
      - run:
          name: Check that dependents of bumped packages are bumped too
          command: scripts/ci.sh cascade-bump-check

  coverage-final:
    executor: node-ci
    steps:
      - checkout
      - run:
          name: Finalize coverage on Codacy
          command: scripts/ci.sh coverage-final

  smoke-extensions:
    machine: true
    steps:
      - checkout
      - run:
          name: Boot the composed stack with the example extension and assert
          command: make smoke-extensions

  test-extension-harness:
    machine: true
    steps:
      - checkout
      - run:
          name: Build navi-hey-test image and run the example extension suite through it
          command: make test-extension-harness

  check-version-tag:
    docker:
      - image: darthjee/circleci_node:0.2.1
    steps:
      - checkout
      - run:
          name: Check tag matches package.json and README versions
          command: bash scripts/check_tag_version.sh

  release-deku-sprout:
    executor: node-ci
    steps:
      - checkout
      - run:
          name: Release deku-sprout if its version is not on npm
          command: scripts/ci.sh release-npm deku-sprout
      - persist_to_workspace:
          root: .
          paths: [released/deku-sprout]

  push-tag-deku-sprout:
    executor: node-ci
    steps:
      - checkout
      - skip-unless-released:
          release: deku-sprout
      - run:
          name: Push the deku-sprout release tag
          command: scripts/ci.sh push-tag deku-sprout

  release-deku-swarm:
    executor: node-ci
    steps:
      - checkout
      - run:
          name: Release deku-swarm if its version is not on npm
          command: scripts/ci.sh release-npm deku-swarm
      - persist_to_workspace:
          root: .
          paths: [released/deku-swarm]

  push-tag-deku-swarm:
    executor: node-ci
    steps:
      - checkout
      - skip-unless-released:
          release: deku-swarm
      - run:
          name: Push the deku-swarm release tag
          command: scripts/ci.sh push-tag deku-swarm

  release-navi-hey:
    executor: node-ci
    steps:
      - checkout
      - install-deps:
          path: source
          frozen: true
      - run:
          name: Build frontend
          command: scripts/ci.sh build-frontend
      - run:
          name: Pin local dependencies
          command: scripts/ci.sh pin-local-deps
      - run:
          name: Release navi-hey if its version is not on npm
          command: scripts/ci.sh release-npm navi-hey

  release-navi-hey-client:
    executor: node-ci
    steps:
      - checkout
      - run:
          name: Release navi-hey-client if its version is not on npm
          command: scripts/ci.sh release-npm navi-hey-client
      - persist_to_workspace:
          root: .
          paths: [released/navi-hey-client]

  push-tag-navi-hey-client:
    executor: node-ci
    steps:
      - checkout
      - skip-unless-released:
          release: navi-hey-client
      - run:
          name: Push the navi-hey-client release tag
          command: scripts/ci.sh push-tag navi-hey-client

  release-darthjee-navi-hey-client:
    machine: true
    steps:
      - checkout
      - run:
          name: Release darthjee/navi-hey-client if its version is not on Docker Hub
          command: scripts/ci.sh release-docker darthjee/navi-hey-client clients/node release-client
      - persist_to_workspace:
          root: .
          paths: [released/darthjee-navi-hey-client]

  update-description-client:
    docker:
      - image: darthjee/scripts:0.6.0
    steps:
      - checkout
      - skip-unless-released:
          release: darthjee/navi-hey-client
      - run:
          name: Update client Docker Hub description
          command: sh scripts/update-description-client.sh

  release-darthjee-navi-hey:
    machine: true
    steps:
      - checkout
      - run:
          name: Release darthjee/navi-hey if its version is not on Docker Hub
          command: scripts/ci.sh release-docker darthjee/navi-hey source release
      - persist_to_workspace:
          root: .
          paths: [released/darthjee-navi-hey]

  update-description:
    docker:
      - image: darthjee/scripts:0.6.0
    steps:
      - checkout
      - skip-unless-released:
          release: darthjee/navi-hey
      - run:
          name: Update Docker Hub description
          command: sh scripts/update-description.sh

  build-and-release-demo:
    machine: true
    steps:
      - checkout
      - skip-unless-released:
          release: darthjee/navi-hey
      - run:
          name: Trigger Deploy
          command: RENDER_SERVICE_NAME=$DEMO_RENDER_SERVICE_NAME scripts/deploy.sh deploy

  build-and-release-demo-app:
    machine: true
    steps:
      - checkout
      - skip-unless-released:
          release: darthjee/navi-hey
      - run:
          name: Trigger Deploy
          command: RENDER_SERVICE_NAME=$DEMO_APP_RENDER_SERVICE_NAME scripts/deploy.sh deploy

  build-and-release-navi-hey-test:
    machine: true
    steps:
      - checkout
      - skip-unless-released:
          release: darthjee/navi-hey
      - run:
          name: Build and release the navi-hey-test harness image
          command: make release-navi-hey-test TAG=${CIRCLE_TAG}
