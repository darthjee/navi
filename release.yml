# Release dependency tree.
#
# Single source of truth for every release: where it lives, its platform,
# what it depends on and its extra GitHub tag prefix. The release scripts
# and the cascade-bump test read this file.
#
# A docker entry's version is the `version` of the package.json in its folder.
#
# Checked against each package.json by `scripts/ci.sh validate-release-yml`.
packages:
  deku-sprout:
    folder: deku-sprout
    platform: npm
    depends_on: []
    tag_prefix: sprout-
  deku-swarm:
    folder: worker
    platform: npm
    depends_on: []
    tag_prefix: swarm-
  navi-hey:
    folder: source
    platform: npm
    depends_on: [deku-sprout, deku-swarm]
  darthjee/navi-hey:
    folder: source
    platform: docker
    depends_on: [navi-hey]
  navi-hey-client:
    folder: clients/node
    platform: npm
    depends_on: [deku-sprout]
    tag_prefix: node_client-
  darthjee/navi-hey-client:
    folder: clients/node
    platform: docker
    depends_on: [navi-hey-client]
